<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACK QUEEN MD | PAIRING</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #000000;
            --accent: #ffffff;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--primary);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .glass-card {
            background: #111;
            border: 1px solid #333;
            border-radius: 25px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(255,255,255,0.1);
        }

        .dev-name {
            font-size: 0.6rem;
            color: #666;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 5px;
            color: var(--accent);
        }

        .sub-title {
            color: #888;
            font-size: 0.8rem;
            margin-bottom: 30px;
        }

        .input-box {
            background: #000;
            border: 1px solid var(--accent);
            padding: 15px;
            border-radius: 10px;
            width: 100%;
            color: #fff;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
            font-family: 'Orbitron', sans-serif;
            box-sizing: border-box;
        }

        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-family: 'Orbitron', sans-serif;
            transition: 0.4s;
        }

        button:hover {
            box-shadow: 0 0 15px var(--accent);
        }

        /* MAKO XD Bottom Animation */
        .mako-footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #fff;
            opacity: 0.6;
            letter-spacing: 5px;
            animation: slideUp 2s ease-out forwards;
        }

        @keyframes slideUp {
            0% { transform: translateY(40px); opacity: 0; }
            100% { transform: translateY(0); opacity: 0.6; }
        }

        .code-display {
            font-size: 2rem;
            color: var(--accent);
            margin: 20px 0;
            padding: 10px;
            border: 1px dashed var(--accent);
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="dev-name">DEVELOPER : LINZO MAKO XD</div>
        
        <h1>BLACK QUEEN MD</h1>
        <p class="sub-title">WHATSAPP PAIRING SYSTEM</p>
        
        <input type="text" id="phoneInput" class="input-box" placeholder="947xxxxxxxxx" />
        <button id="pairBtn" onclick="getPairingCode()">GET PAIRING CODE</button>

        <div id="result"></div>

        <div class="mako-footer">MAKO XD</div>
    </div>

<script>
    async function getPairingCode() {
        const btn = document.getElementById('pairBtn');
        const res = document.getElementById('result');
        const num = document.getElementById('phoneInput').value;

        if (num.length < 9) { 
            alert("Please enter a valid phone number."); 
            return; 
        }

        btn.disabled = true;
        btn.innerText = "CONNECTING...";

        try {
            const response = await fetch(`/pair?number=${encodeURIComponent(num)}`);
            const data = await response.json();

            if (data.code) {
                res.innerHTML = `
                    <div class="code-display">${data.code}</div>
                    <p style="font-size: 0.7rem; color:#888;">COPY THIS CODE AND LINK DEVICE</p>
                `;
            } else {
                res.innerHTML = '<p style="color:red; font-size:0.8rem;">Error Generating Code!</p>';
            }
        } catch(e) {
            res.innerHTML = '<p style="color:red; font-size:0.8rem;">Server Connection Failed!</p>';
        } finally {
            btn.disabled = false;
            btn.innerText = "GET PAIRING CODE";
        }
    }
</script>
</body>
</html>
